name: "General Issue"
description: "Something to build or improve"
title: "[General]: "
labels: ["enhancement"]

body:
  - type: "textarea"
    id: "description"
    attributes:
      label: "Description"
      placeholder: "What needs to be done?"
    validations:
      required: true

  - type: "checkboxes"
    id: "checklist"
    attributes:
      label: "Checklist"
      options:
        - label: "Tested locally"
        - label: "Types updated if needed"
